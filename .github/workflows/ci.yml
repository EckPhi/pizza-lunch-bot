name: CI and container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: pizza-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo +stable metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pizza-lunch-bot") | .version')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH and match Cargo.toml (v$version)." >&2
            exit 1
          fi
      - name: Build and smoke test the image
        run: |
          docker build --tag pizza-lunch-bot:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          code=0
          output=$(docker run --rm --network none pizza-lunch-bot:ci 2>&1) || code=$?
          test "$code" -eq 1
          grep -F 'Set TELEGRAM_BOT_TOKEN' <<< "$output"
      - name: Export the verified image
        if: github.event_name == 'push'
        run: docker save --output "${RUNNER_TEMP}/pizza-image.tar" pizza-lunch-bot:ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: pizza-image
          path: ${{ runner.temp }}/pizza-image.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pizza-image
          path: ${{ runner.temp }}
      - name: Publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input "${RUNNER_TEMP}/pizza-image.tar"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags=("${GITHUB_REF_NAME#v}")
          else
            tags=("$GITHUB_SHA" latest)
          fi
          for tag in "${tags[@]}"; do
            docker tag pizza-lunch-bot:ci "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          printf 'Linux amd64 container image: `%s`\n\nSee the [Docker setup guide](https://github.com/%s/blob/%s/README.md#docker).\n' \
            "$image" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
